<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Страница не найдена — водка казино</title>
    <style>
        :root { --primary: #1A64FC; --primary-rgb: 26,100,252; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', system-ui, sans-serif;
            background: #050508;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap {
            text-align: center;
            padding: 40px 24px;
            max-width: 480px;
        }
        .code {
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), rgba(var(--primary-rgb),0.4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }
        p {
            color: #8b8b99;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.4);
            transition: all 0.3s;
            margin: 0 8px 12px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(var(--primary-rgb), 0.6); }
        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: none;
        }
        .btn-ghost:hover { border-color: var(--primary); box-shadow: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>Страница не найдена</h1>
        <p>Возможно, вы перешли по устаревшей ссылке или допустили опечатку в адресе. Вернитесь на главную страницу водка казино.</p>
        <a href="/" class="btn">На главную</a>
        <a href="/go" class="btn btn-ghost">Играть сейчас</a>
    </div>
</body>
</html>
